# Local PostgreSQL for development (optional — a normal PostgreSQL install works too).
# Start: docker compose up -d     Stop: docker compose down
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: oa
      POSTGRES_PASSWORD: oa
      POSTGRES_DB: offshoreassure
    ports:
      - "5432:5432"
    volumes:
      - oa-pgdata:/var/lib/postgresql/data
volumes:
  oa-pgdata:
